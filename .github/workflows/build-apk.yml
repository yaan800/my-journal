# Builds My Journal in the cloud and publishes the APK as a download.
# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets first (see README, step 3)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/myjournal.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/myjournal.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "MyJournal-build-${{ github.run_number }}.apk"

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: MyJournal-build-${{ github.run_number }}
          path: MyJournal-build-${{ github.run_number }}.apk

      - name: Publish as a Release (direct download link for your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "MyJournal-build-${{ github.run_number }}.apk" \
            --title "My Journal — build ${{ github.run_number }}" \
            --notes "Open this page on your phone, tap the .apk to download, then open it to install. Updates install over the old version and keep your notes."
